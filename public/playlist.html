<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>v4.90 플레이리스트 가져오기</title><style>body{background:#08152e;color:#edf4ff;font:16px sans-serif;max-width:850px;margin:35px auto;padding:16px}input,button{font:inherit;padding:12px;margin:7px 0;border-radius:6px}input{width:95%;background:#132b51;color:white;border:1px solid #76aaff}button{background:#2656a2;color:white;border:0;cursor:pointer}li{margin:7px 0}small{color:#bac9e4}</style><h1>YouTube 플레이리스트 일괄 가져오기</h1><p>관리자 전용 · 최대 500개 영상 조회 · 정답은 자동 생성하지 않습니다.</p><label>관리자 비밀번호<input id="password" type="password"></label><label>플레이리스트 URL<input id="url" placeholder="https://www.youtube.com/playlist?list=..."></label><button id="load">목록 불러오기</button> <button id="save" disabled>문제 초안 JSON 다운로드</button><p id="status" role="status"></p><ol id="items"></ol><small>다운로드한 JSON은 미완성 초안입니다. 작품명 정답과 필요한 정보를 채운 뒤 기존 게임의 문제 등록 기능으로 가져오세요. YouTube API 키는 서버 환경변수 YOUTUBE_API_KEY로 설정합니다.</small><script>
let data=null;const $=id=>document.getElementById(id);
$('load').onclick=async()=>{data=null;$('save').disabled=true;$('items').replaceChildren();$('status').textContent='조회 중...';try{const r=await fetch('/api/youtube/playlist?url='+encodeURIComponent($('url').value),{headers:{'x-admin-password':$('password').value}});const d=await r.json();if(!r.ok)throw Error(d.error||'조회 실패');data=d.items;$('status').textContent=`${data.length}개 영상 조회 완료${d.truncated?' (500개 제한으로 일부 제외됨)':''}`;for(const x of data){const li=document.createElement('li');li.textContent=x.youtubeTitle+' · '+x.videoId;$('items').append(li);}$('save').disabled=!data.length;}catch(e){$('status').textContent=e.message;}};
$('save').onclick=()=>{if(!data)return;const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='youtube-playlist-drafts-v4.90.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);};
</script></html>
