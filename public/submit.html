<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OST 문제 출제 · 승인 관리</title><style>body{background:#06142d;color:#eaf7ff;font:16px Arial,'Malgun Gothic',sans-serif;max-width:850px;margin:35px auto;padding:0 15px}section{background:#10284a;border:1px solid #4d9bc8;border-radius:12px;padding:18px;margin:15px 0}label{display:block;margin:12px 0 5px}input,select,textarea,button{font:inherit;border-radius:6px;padding:9px;background:#061a33;color:white;border:1px solid #56b9ee;max-width:100%}input,textarea{width:100%;box-sizing:border-box}button{cursor:pointer;background:#164d87;margin:5px}textarea{height:100px} .hide{display:none}.item{border-top:1px solid #45769b;padding:12px 0}.muted{color:#bdd0e4}a{color:#8ad8ff}</style><h1>🌙 OST 문제 출제</h1><p class="muted">친구는 자기 문제만 볼 수 있고, 관리자는 승인한 문제를 게임에 불러올 수 있습니다.</p><section id="gate"><h2>처음 입장</h2><label>고정 초대코드</label><input id="invite" autocomplete="off"><label>닉네임</label><input id="nick" maxlength="20"><button id="enter">입장</button></section><section id="editor" class="hide"><h2>문제 제출</h2><p id="identity"></p><label>유튜브 URL</label><input id="videoUrl"><label>시작 초 / 종료 초</label><input id="startTime" type="number" value="0" min="0"><input id="endTime" type="number" value="45" min="1"><label>작품명 정답</label><input id="answer"><label>인정 별칭 (쉼표 구분)</label><input id="aliases"><label>OST 제목 (선택)</label><input id="songName"><label>초성 힌트</label><input id="hintText"><label>히든 문제 유형</label><select id="bonusType"><option value="text">주관식</option><option value="multiple">객관식</option><option value="none">없음</option></select><label>히든 문제</label><input id="bonusQuestion"><label>히든 정답 (주관식)</label><input id="bonusAnswer"><label>히든 정답 별칭</label><input id="bonusAliases"><div id="multi" class="hide"><label>객관식 선택지 4개</label><input id="choice0"><input id="choice1"><input id="choice2"><input id="choice3"><label>정답 번호 (1~4)</label><select id="correctChoice"><option value="0">1</option><option value="1">2</option><option value="2">3</option><option value="3">4</option></select></div><button id="send">제출 / 수정 저장</button><button id="clear">새 문제 작성</button><h2>내가 제출한 문제</h2><div id="mine"></div></section><section id="admin"><h2>관리자 승인</h2><label>관리자 비밀번호</label><input id="adminPassword" type="password"><button id="adminOpen">관리자 출제 화면 열기</button><button id="adminSend">관리자 문제 바로 등록</button><button id="refresh">제출 목록 조회</button><button id="export">승인 문제 JSON 다운로드</button><div id="progress"></div><div id="all"></div></section><p id="message" role="status"></p><script>
const $=id=>document.getElementById(id),keys=['videoUrl','startTime','endTime','answer','aliases','songName','hintText','bonusType','bonusQuestion','bonusAnswer','bonusAliases'];let token=localStorage.getItem('ost-submit-token')||'',editing=null,owned=[];
async function api(url,method='GET',body,admin=false){const r=await fetch(url,{method,headers:{'content-type':'application/json','x-submitter-token':token,...(admin?{'x-admin-password':$('adminPassword').value}:{})},body:body===undefined?undefined:JSON.stringify(body)});const d=await r.json();if(!r.ok)throw Error(d.error||'요청 실패');return d;}
function notice(s){$('message').textContent=s;}
function getQ(){const q=Object.fromEntries(keys.map(k=>[k,$(k).value]));q.startTime=Number(q.startTime);q.endTime=Number(q.endTime);q.choices=[0,1,2,3].map(i=>$('choice'+i).value);q.correctChoice=Number($('correctChoice').value);return q;}
function fill(q){for(const k of keys)$(k).value=q[k]??'';for(let i=0;i<4;i++)$('choice'+i).value=q.choices?.[i]||'';$('correctChoice').value=q.correctChoice??0;$('bonusType').onchange();}
function reset(){editing=null;document.querySelectorAll('#editor input').forEach(x=>x.value='');$('startTime').value=0;$('endTime').value=45;$('bonusType').value='text';$('bonusType').onchange();}
$('bonusType').onchange=()=>{$('multi').classList.toggle('hide',$('bonusType').value!=='multiple');};
async function mine(){owned=await api('/api/submissions/mine');$('mine').replaceChildren();owned.forEach(x=>{const d=document.createElement('div');d.className='item';const label=document.createElement('span');label.textContent=`${x.question.answer} · ${x.status==='pending'?'승인 대기':x.status==='approved'?'승인 완료':'거절'}`;d.append(label);if(x.status==='pending'){const b=document.createElement('button');b.textContent='수정';b.onclick=()=>{editing=x.id;fill(x.question);scrollTo(0,0);};d.append(b);}$('mine').append(d);});}
$('enter').onclick=async()=>{try{const r=await api('/api/submissions/access','POST',{inviteCode:$('invite').value,nickname:$('nick').value});token=r.token;localStorage.setItem('ost-submit-token',token);$('identity').textContent=r.nickname+'님';$('gate').classList.add('hide');$('editor').classList.remove('hide');await mine();}catch(e){notice(e.message);}};
$('send').onclick=async()=>{try{await api(editing?'/api/submissions/'+editing:'/api/submissions',editing?'PUT':'POST',{question:getQ()});notice('저장 완료. 관리자 승인 대기 중입니다.');reset();await mine();}catch(e){notice(e.message);}};
$('clear').onclick=reset;
async function adminList(){const d=await api('/api/submissions/admin','GET',undefined,true);$('progress').textContent=`승인 완료 ${d.approved} / 100 · 대기 ${d.items.filter(x=>x.status==='pending').length}`;$('all').replaceChildren();d.items.forEach(x=>{const div=document.createElement('div');div.className='item';const p=document.createElement('p');p.textContent=`${x.nickname} · ${x.question.answer} · ${x.status}`;div.append(p);const detail=document.createElement('details');const summary=document.createElement('summary');summary.textContent='문제 내용 확인';detail.append(summary);const pre=document.createElement('pre');pre.style.whiteSpace='pre-wrap';pre.textContent=JSON.stringify(x.question,null,2);detail.append(pre);div.append(detail);for(const [label,status] of [['승인','approved'],['거절','rejected'],['대기','pending']]){const b=document.createElement('button');b.textContent=label;b.onclick=async()=>{try{await api('/api/submissions/admin/'+x.id,'PATCH',{status},true);await adminList();}catch(e){notice(e.message);}};div.append(b);}const edit=document.createElement('button');edit.textContent='JSON 수정';edit.onclick=async()=>{const raw=prompt('문제 JSON 수정',JSON.stringify(x.question,null,2));if(raw===null)return;try{const q=JSON.parse(raw);await api('/api/submissions/admin/'+x.id,'PATCH',{status:x.status,question:q},true);await adminList();}catch(e){notice(e.message);}};div.append(edit);$('all').append(div);});}
$('adminOpen').onclick=async()=>{try{await api('/api/submissions/admin','GET',undefined,true);$('editor').classList.remove('hide');$('identity').textContent='관리자 출제 모드';notice('관리자 출제 화면이 열렸습니다.');}catch(e){notice(e.message);}};
$('adminSend').onclick=async()=>{try{const r=await api('/api/submissions','POST',{question:getQ()},true);notice(r.status==='approved'?'관리자 문제 등록 및 자동 승인 완료!':'문제 등록 완료');reset();await adminList();}catch(e){notice(e.message);}};
$('refresh').onclick=()=>adminList().catch(e=>notice(e.message));
$('export').onclick=async()=>{try{const qs=await api('/api/submissions/admin/export','GET',undefined,true);const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(qs,null,2)],{type:'application/json'}));a.download='approved-questions.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);}catch(e){notice(e.message);}};
if(token){mine().then(()=>{$('gate').classList.add('hide');$('editor').classList.remove('hide');}).catch(()=>{localStorage.removeItem('ost-submit-token');token='';});}
$('bonusType').onchange();
</script></html>
