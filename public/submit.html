<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OST 문제 출제 · 승인 관리</title><link rel="stylesheet" href="/console-v4-40.css"><style>
body{margin:0;background:#06142d url('/moonlit-background.jpg') center center/cover fixed;color:#f4f8ff;font:16px/1.5 Arial,'Malgun Gothic',sans-serif}body:before{content:"";position:fixed;inset:0;background:rgba(1,11,38,.77);pointer-events:none;z-index:-1}main{max-width:980px;margin:24px auto;padding:0 14px 50px}section{background:rgba(7,23,59,.88);border:1px solid #6682e3;border-radius:12px;padding:16px;margin:14px 0}h1,h2{margin:0 0 12px}h2{font-size:22px}label{display:block;margin:8px 0 4px}input,select,textarea{display:block;width:100%;min-width:0;box-sizing:border-box;padding:11px;background:#031631;color:#fff;border:1px solid #58b7ec;border-radius:6px;font:inherit}button{cursor:pointer;color:#fff;background:linear-gradient(#155ba8,#08224f);border:1px solid #53baff;border-radius:6px;padding:11px 15px;font:inherit}button:hover{filter:brightness(1.15)}.hide{display:none!important}.muted{color:#bed1eb}.editor-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.time-editor{grid-column:1/-1;padding:14px;border:1px solid #7965e8;border-radius:10px;display:grid;gap:10px}.time-editor button{width:100%}.preview{width:100%;max-width:616px;aspect-ratio:16/9;background:#0d1024;border-radius:8px;overflow:hidden}.preview-placeholder{height:100%;display:grid;place-items:center;color:#aeb5d7;text-align:center;padding:12px}.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.purple{background:#7030dc}.span2{grid-column:1/-1}.actions{margin-top:16px;display:flex;gap:10px;flex-wrap:wrap}.item{border-top:1px solid #45769b;padding:12px 0}.item button{margin:4px}#message{color:#ffe3a5;min-height:25px}pre{overflow:auto;max-height:300px}#admin{border-color:#4d9bc8}#admin button{margin:4px}@media(max-width:640px){.editor-grid,.two{grid-template-columns:1fr}.span2{grid-column:auto}}
</style></head><body><main><h1>🌙 OST 문제 출제</h1><p class="muted">기존 게임 출제 화면과 같은 입력 방식입니다. 친구들이 제출한 문제의 상태를 함께 확인할 수 있습니다. 정답과 히든 내용은 공개되지 않습니다.</p>
<section id="gate"><h2>처음 입장</h2><label>고정 초대코드<input id="invite" autocomplete="off"></label><label>닉네임<input id="nick" maxlength="20"></label><button id="enter">입장</button></section>
<section id="editor" class="hide"><h2>문제 출제</h2><p id="identity"></p><div class="editor-grid">
<label>유튜브 URL<input id="videoUrl" placeholder="https://www.youtube.com/watch?v=..."></label><label>작품명 정답<input id="answer"></label>
<div class="time-editor"><b>OST 재생 구간 설정 (시:분:초)</b><div id="preview" class="preview"><div class="preview-placeholder">영상 미리보기를 누르면 여기서 재생됩니다.</div></div><button id="previewButton" type="button">▶ 유튜브 영상 미리보기</button><div class="two"><label>시작 시간<input id="startTime" value="00:00:00" inputmode="numeric" placeholder="00:00:15"></label><label>종료 시간<input id="endTime" value="00:00:45" inputmode="numeric" placeholder="00:00:45"></label></div><div class="two"><button class="purple" id="markStart" type="button">현위치에서 시작</button><button class="purple" id="markEnd" type="button">현위치에서 종료</button></div></div>
<label>정답 별칭(쉼표 구분)<input id="aliases"></label><label style="grid-column:1/-1"><input type="checkbox" id="aiRequested" style="display:inline;width:auto"> AI 등록 요청 (관리자가 일괄 분석하며 자동 승인되지 않음)</label><label>OST 제목<input id="songName"></label><label>15초 힌트<input id="hintText"></label><label>히든 유형<select id="bonusType"><option value="text">주관식</option><option value="multiple">4지선다</option><option value="none">없음</option></select></label>
<div id="bonusFields" class="span2 editor-grid"><label>히든 질문<input id="bonusQuestion"></label><div id="bonusTextFields" class="editor-grid span2"><label>히든 정답<input id="bonusAnswer"></label><label>히든 인정 별칭<input id="bonusAliases"></label></div><div id="multi" class="hide span2 editor-grid"><label>선택지 1<input id="choice0"></label><label>선택지 2<input id="choice1"></label><label>선택지 3<input id="choice2"></label><label>선택지 4<input id="choice3"></label><label>정답 번호<select id="correctChoice"><option value="0">1번</option><option value="1">2번</option><option value="2">3번</option><option value="3">4번</option></select></label></div></div>
</div><div class="actions"><button id="send">문제 제출 / 수정 저장</button><button id="clear">새 문제 작성</button><button id="aiQuick" type="button" class="purple">✨ AI 등록 요청 (URL만)</button><button id="showList" type="button">☷ 문제 목록</button></div><p id="aiNotice" class="hide" role="status" aria-live="polite" style="padding:12px;border:1px solid #58b7ec;border-radius:8px;background:rgba(17,81,128,.55);margin:12px 0"></p><div id="sharedList" class="hide" style="margin-top:16px"><h2>전체 제출 문제 목록</h2><p class="muted">초대코드로 입장한 친구들이 제출 상태를 볼 수 있습니다. 정답·영상 주소·히든 문제는 공개되지 않습니다.</p><div id="sharedItems"></div></div><h2 style="margin-top:24px">내가 제출한 문제</h2><div id="mine"></div></section>
<section id="admin"><h2>관리자 승인</h2><label>관리자 비밀번호<input id="adminPassword" type="password"></label><button id="adminOpen">관리자 출제 화면 열기</button><button id="adminSend">관리자 문제 바로 등록</button><button id="refresh">제출 목록 조회</button><button id="export">승인 문제 JSON 다운로드</button><button id="aiRefresh">AI 요청 조회</button><button id="aiExport">히든 문제 요청 JSON 다운로드</button><label>히든 문제 JSON 가져오기<input id="aiFile" type="file" accept=".json,application/json"></label><button id="aiImport">히든 문제 일괄 미리보기/등록</button><label>복원용 백업 ID<input id="restoreBatch" placeholder="복원할 백업 ID"></label><button id="restoreAi">히든 일괄 등록 백업 복원</button><div id="aiList"></div><div id="progress"></div><div id="all"></div></section><p id="message" role="status"></p></main><script src="https://www.youtube.com/iframe_api">
async function downloadJson(data,name){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1500);}
$('aiRefresh').onclick=async()=>{try{const data=await api('/api/ai/jobs','GET',undefined,true);const box=$('aiList');box.replaceChildren();const p=document.createElement('p');p.textContent=`AI 요청 ${data.items.length}개 (Windows 분석기에서 처리 가능)`;box.append(p);for(const x of data.items){const d=document.createElement('div');d.className='item';const line=document.createElement('span');line.textContent=`#${x.id} ${x.answer} · ${x.aiStatus||'대기'}`;d.append(line);if(x.aiStatus==='ready'&&x.aiResult){const btn=document.createElement('button');btn.textContent=`분석 결과 적용 ${formatTime(x.aiResult.start_seconds)} ~ ${formatTime(x.aiResult.end_seconds)}`;btn.onclick=async()=>{if(!confirm('이 문제의 시작·종료 시간만 변경할까요?'))return;try{await api('/api/ai/apply/'+x.id,'POST',{},true);notice('하이라이트 시간 반영 완료');$('aiRefresh').click();}catch(e){notice(e.message);}};d.append(btn);}box.append(d);}}catch(e){notice(e.message);}};
$('aiExport').onclick=async()=>{try{await downloadJson(await api('/api/ai/hidden-export','GET',undefined,true),'hidden-requests.json');}catch(e){notice(e.message);}};
$('aiImport').onclick=async()=>{try{const f=$('aiFile').files[0];if(!f)throw Error('JSON 파일을 선택하세요.');const data=JSON.parse(await f.text());const payload={items:data.items};const preview=await api('/api/ai/hidden-preview','POST',payload,true);if(!confirm(`${preview.count}개의 히든 문제만 변경합니다. 기존 작품명·주소·정답은 유지합니다. 계속할까요?`))return;const result=await api('/api/ai/hidden-import','POST',payload,true);$('restoreBatch').value=result.batch;notice(`${result.updated}개 등록 완료. 복원 백업 ID: ${result.batch}`);await adminList();}catch(e){notice(e.message);}};
$('restoreAi').onclick=async()=>{try{const id=$('restoreBatch').value.trim();if(!confirm('이 백업의 히든 문제 변경을 복원할까요? 승인 대기 문제만 복원됩니다.'))return;const r=await api('/api/ai/restore/'+encodeURIComponent(id),'POST',{},true);notice(`${r.restored}개 복원 완료`);await adminList();}catch(e){notice(e.message);}};
</script><script>
const $=id=>document.getElementById(id),keys=['videoUrl','startTime','endTime','answer','aliases','songName','hintText','bonusType','bonusQuestion','bonusAnswer','bonusAliases'];let token=localStorage.getItem('ost-submit-token')||'',editing=null,owned=[];

function formatTime(value){const n=Math.max(0,Math.floor(Number(value)||0));return [Math.floor(n/3600),Math.floor(n%3600/60),n%60].map(x=>String(x).padStart(2,'0')).join(':');}
function parseTime(value){const v=String(value??'').trim();if(/^\d+$/.test(v))return Number(v);if(!/^\d{1,3}:[0-5]\d:[0-5]\d$/.test(v))return null;const [h,m,s]=v.split(':').map(Number);return h*3600+m*60+s;}
function videoId(raw){const v=String(raw||'').trim();if(/^[\w-]{11}$/.test(v))return v;try{const u=new URL(v);if(['youtu.be','www.youtu.be'].includes(u.hostname))return u.pathname.split('/')[1];if(!['youtube.com','www.youtube.com','m.youtube.com','music.youtube.com','youtube-nocookie.com','www.youtube-nocookie.com'].includes(u.hostname))return null;return u.pathname==='/watch'?u.searchParams.get('v'):(u.pathname.match(/^\/(?:embed|shorts|live)\/([\w-]{11})/)||[])[1];}catch{return null;}}
let editorPlayer=null,editorGeneration=0;
function clearEditorPreview(){editorGeneration++;if(editorPlayer){try{editorPlayer.destroy();}catch{}editorPlayer=null;}document.getElementById('preview').innerHTML='<div class="preview-placeholder">영상 미리보기를 누르면 여기서 재생됩니다.</div>';}
$('previewButton').onclick=()=>{const id=videoId($('videoUrl').value);if(!id)return notice('먼저 올바른 유튜브 URL을 입력하세요.');clearEditorPreview();const generation=editorGeneration;const target=document.createElement('div');target.id='editorPreviewTarget';$('preview').replaceChildren(target);const make=()=>{if(generation!==editorGeneration)return;editorPlayer=new YT.Player('editorPreviewTarget',{videoId:id,width:'100%',height:'100%',playerVars:{controls:1,playsinline:1,origin:location.origin},events:{onReady:e=>{const sec=parseTime($('startTime').value);if(sec!==null)try{e.target.seekTo(sec,true);}catch{}}}});};if(window.YT?.Player)make();else{let attempts=0;const timer=setInterval(()=>{if(generation!==editorGeneration||++attempts>100){clearInterval(timer);return;}if(window.YT?.Player){clearInterval(timer);make();}},100);}};
for(const [key,btn] of [['startTime','markStart'],['endTime','markEnd']]){$(btn).onclick=()=>{if(!editorPlayer||typeof editorPlayer.getCurrentTime!=='function')return notice('먼저 유튜브 영상 미리보기를 실행하세요.');let sec;try{sec=Math.floor(editorPlayer.getCurrentTime());}catch{return notice('영상 시간을 가져올 수 없습니다.');}if(!Number.isFinite(sec)||sec<0)return notice('영상 위치를 확인할 수 없습니다.');$(key).value=formatTime(sec);notice('');};}
for(const key of ['startTime','endTime'])$(key).addEventListener('change',()=>{const sec=parseTime($(key).value);if(sec===null)return notice('시간은 00:00:15 형식으로 입력하세요.');$(key).value=formatTime(sec);notice('');});
$('bonusType').addEventListener('change',()=>{const type=$('bonusType').value;$('bonusFields').classList.toggle('hide',type==='none');$('bonusTextFields').classList.toggle('hide',type!=='text');});

async function api(url,method='GET',body,admin=false){const r=await fetch(url,{method,headers:{'content-type':'application/json','x-submitter-token':token,...(admin?{'x-admin-password':$('adminPassword').value}:{})},body:body===undefined?undefined:JSON.stringify(body)});const d=await r.json();if(!r.ok)throw Error(d.error||'요청 실패');return d;}
function notice(s){$('message').textContent=s;}
function aiNotice(s){$('aiNotice').textContent=s;$('aiNotice').classList.toggle('hide',!s);}
function getQ(){const q=Object.fromEntries(keys.map(k=>[k,$(k).value]));q.startTime=parseTime(q.startTime);q.endTime=parseTime(q.endTime);if(q.startTime===null||q.endTime===null)throw Error('시간은 00:00:15 형식으로 입력하세요.');q.choices=[0,1,2,3].map(i=>$('choice'+i).value);q.correctChoice=Number($('correctChoice').value);return q;}
function fill(q){clearEditorPreview();for(const k of keys)$(k).value=(k==='startTime'||k==='endTime')?formatTime(q[k]):(q[k]??'');for(let i=0;i<4;i++)$('choice'+i).value=q.choices?.[i]||'';$('correctChoice').value=q.correctChoice??0;$('bonusType').onchange();}
function reset(){ $('aiRequested').checked=false;editing=null;document.querySelectorAll('#editor input').forEach(x=>x.value='');clearEditorPreview();$('startTime').value='00:00:00';$('endTime').value='00:00:45';$('bonusType').value='text';$('bonusType').onchange();}
$('bonusType').onchange=()=>{$('multi').classList.toggle('hide',$('bonusType').value!=='multiple');$('bonusFields').classList.toggle('hide',$('bonusType').value==='none');$('bonusTextFields').classList.toggle('hide',$('bonusType').value!=='text');};
async function mine(){owned=await api('/api/submissions/mine');$('mine').replaceChildren();owned.forEach(x=>{const d=document.createElement('div');d.className='item';const label=document.createElement('span');label.textContent=`${x.question.answer||'(AI 분석 대기 · 정답 미입력)'} · ${x.status==='pending'?'승인 대기':x.status==='approved'?'승인 완료':'거절'}`;d.append(label);if(x.status==='pending'){const b=document.createElement('button');b.textContent='수정';b.onclick=()=>{editing=x.id;fill(x.question);$('aiRequested').checked=!!x.aiRequested;document.getElementById('editor').scrollIntoView({behavior:'smooth'});};d.append(b);}$('mine').append(d);});}
$('enter').onclick=async()=>{try{const r=await api('/api/submissions/access','POST',{inviteCode:$('invite').value,nickname:$('nick').value});token=r.token;localStorage.setItem('ost-submit-token',token);$('identity').textContent=r.nickname+'님';$('gate').classList.add('hide');$('editor').classList.remove('hide');await mine();}catch(e){notice(e.message);}};
$('send').onclick=async()=>{try{await api(editing?'/api/submissions/'+editing:'/api/submissions',editing?'PUT':'POST',{question:getQ(),aiRequested:$('aiRequested').checked});notice('저장 완료. 관리자 승인 대기 중입니다.');reset();await mine();}catch(e){notice(e.message);}};
$('clear').onclick=reset;
const statusLabel={pending:'승인 대기',approved:'승인 완료',rejected:'거절'};
$('showList').onclick=async()=>{
 const panel=$('sharedList');
 if(!panel.classList.contains('hide')){panel.classList.add('hide');return;}
 if(!token)return notice('문제 목록을 보려면 먼저 초대코드로 입장하세요.');
 const button=$('showList');button.disabled=true;
 try{
  const data=await api('/api/submissions/list');const container=$('sharedItems');container.replaceChildren();
  if(!data.items.length){const p=document.createElement('p');p.textContent='아직 제출된 문제가 없습니다.';container.append(p);}
  for(const x of data.items){const d=document.createElement('div');d.className='item';const t=document.createElement('span');
   const when=x.createdAt?new Date(x.createdAt).toLocaleString('ko-KR'):'날짜 미확인';
   const stage=x.aiRequested?(x.aiStatus==='ready'?'AI 분석 완료':x.aiStatus==='failed'?'AI 분석 재확인 필요':'AI 분석 대기'):'일반 제출';
   t.textContent=`#${x.id} · ${x.nickname||'제출자'} · ${stage} · ${statusLabel[x.status]||'상태 확인 중'} · ${when}`;d.append(t);container.append(d);
  }
  if(data.limited){const p=document.createElement('p');p.textContent='최근 200건까지만 표시됩니다.';container.append(p);}
  panel.classList.remove('hide');
 }catch(e){notice('문제 목록 조회 실패: '+e.message);}finally{button.disabled=false;}
};
$('aiQuick').onclick=async()=>{
 const url=$('videoUrl').value.trim();
 if(!videoId(url))return notice('올바른 유튜브 URL만 입력해 주세요.');
 if(editing!==null)return notice('수정 중인 문제입니다. 새 문제 작성을 누른 뒤 AI 요청해 주세요.');
 const adminMode=!token&&!!$('adminPassword').value.trim();
 if(!token&&!adminMode)return notice('먼저 초대코드로 입장하거나 관리자 비밀번호를 입력하세요.');
 if(!confirm('이 유튜브 URL을 AI 분석 대기 목록에 제출할까요? 정답과 히든 문제는 필요 없습니다.'))return;
 const button=$('aiQuick');button.disabled=true;aiNotice('AI 요청 저장 중...');
 try{
  const question={videoUrl:url,startTime:0,endTime:45,answer:'',aliases:'',songName:'',hintText:'',bonusType:'none',bonusQuestion:'',bonusAnswer:'',bonusAliases:'',choices:[],correctChoice:0};
  const result=await api('/api/submissions','POST',{question,aiRequested:true},adminMode);
  aiNotice('✅ AI 등록 요청 #'+result.id+' 접수 완료! 관리자 검토 및 분석 대기 목록에 저장됐습니다.');notice('AI 등록 요청 저장 완료');
  reset();if(token)await mine();
 }catch(e){aiNotice('❌ AI 요청 실패: '+e.message);notice('AI 요청 실패: '+e.message);}finally{button.disabled=false;}
};
async function adminList(){const d=await api('/api/submissions/admin','GET',undefined,true);$('progress').textContent=`승인 완료 ${d.approved} / 100 · 대기 ${d.items.filter(x=>x.status==='pending').length}`;$('all').replaceChildren();d.items.forEach(x=>{const div=document.createElement('div');div.className='item';const p=document.createElement('p');p.textContent=`${x.nickname} · ${x.question.answer||'(AI 분석 대기)'} · ${x.status}`;div.append(p);const detail=document.createElement('details');const summary=document.createElement('summary');summary.textContent='문제 내용 확인';detail.append(summary);const pre=document.createElement('pre');pre.style.whiteSpace='pre-wrap';pre.textContent=JSON.stringify(x.question,null,2);detail.append(pre);div.append(detail);for(const [label,status] of [['승인','approved'],['거절','rejected'],['대기','pending']]){const b=document.createElement('button');b.textContent=label;b.onclick=async()=>{try{await api('/api/submissions/admin/'+x.id,'PATCH',{status},true);await adminList();}catch(e){notice(e.message);}};div.append(b);}const edit=document.createElement('button');edit.textContent='JSON 수정';edit.onclick=async()=>{const raw=prompt('문제 JSON 수정',JSON.stringify(x.question,null,2));if(raw===null)return;try{const q=JSON.parse(raw);await api('/api/submissions/admin/'+x.id,'PATCH',{status:x.status,question:q},true);await adminList();}catch(e){notice(e.message);}};div.append(edit);$('all').append(div);});}
$('adminOpen').onclick=async()=>{try{await api('/api/submissions/admin','GET',undefined,true);$('editor').classList.remove('hide');$('identity').textContent='관리자 출제 모드';notice('관리자 출제 화면이 열렸습니다.');}catch(e){notice(e.message);}};
$('adminSend').onclick=async()=>{try{const r=await api('/api/submissions','POST',{question:getQ(),aiRequested:$('aiRequested').checked},true);notice(r.status==='approved'?'관리자 문제 등록 및 자동 승인 완료!':'문제 등록 완료');reset();await adminList();}catch(e){notice(e.message);}};
$('refresh').onclick=()=>adminList().catch(e=>notice(e.message));
$('export').onclick=async()=>{try{const qs=await api('/api/submissions/admin/export','GET',undefined,true);const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(qs,null,2)],{type:'application/json'}));a.download='approved-questions.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);}catch(e){notice(e.message);}};
if(token){mine().then(()=>{$('gate').classList.add('hide');$('editor').classList.remove('hide');}).catch(()=>{localStorage.removeItem('ost-submit-token');token='';});}
$('bonusType').onchange();

async function downloadJson(data,name){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1500);}
$('aiRefresh').onclick=async()=>{try{const data=await api('/api/ai/jobs','GET',undefined,true);const box=$('aiList');box.replaceChildren();const p=document.createElement('p');p.textContent=`AI 요청 ${data.items.length}개 (Windows 분석기에서 처리 가능)`;box.append(p);for(const x of data.items){const d=document.createElement('div');d.className='item';const line=document.createElement('span');line.textContent=`#${x.id} ${x.answer} · ${x.aiStatus||'대기'}`;d.append(line);if(x.aiStatus==='ready'&&x.aiResult){const btn=document.createElement('button');btn.textContent=`분석 결과 적용 ${formatTime(x.aiResult.start_seconds)} ~ ${formatTime(x.aiResult.end_seconds)}`;btn.onclick=async()=>{if(!confirm('이 문제의 시작·종료 시간만 변경할까요?'))return;try{await api('/api/ai/apply/'+x.id,'POST',{},true);notice('하이라이트 시간 반영 완료');$('aiRefresh').click();}catch(e){notice(e.message);}};d.append(btn);}box.append(d);}}catch(e){notice(e.message);}};
$('aiExport').onclick=async()=>{try{await downloadJson(await api('/api/ai/hidden-export','GET',undefined,true),'hidden-requests.json');}catch(e){notice(e.message);}};
$('aiImport').onclick=async()=>{try{const f=$('aiFile').files[0];if(!f)throw Error('JSON 파일을 선택하세요.');const data=JSON.parse(await f.text());const payload={items:data.items};const preview=await api('/api/ai/hidden-preview','POST',payload,true);if(!confirm(`${preview.count}개의 히든 문제만 변경합니다. 기존 작품명·주소·정답은 유지합니다. 계속할까요?`))return;const result=await api('/api/ai/hidden-import','POST',payload,true);$('restoreBatch').value=result.batch;notice(`${result.updated}개 등록 완료. 복원 백업 ID: ${result.batch}`);await adminList();}catch(e){notice(e.message);}};
$('restoreAi').onclick=async()=>{try{const id=$('restoreBatch').value.trim();if(!confirm('이 백업의 히든 문제 변경을 복원할까요? 승인 대기 문제만 복원됩니다.'))return;const r=await api('/api/ai/restore/'+encodeURIComponent(id),'POST',{},true);notice(`${r.restored}개 복원 완료`);await adminList();}catch(e){notice(e.message);}};
</script></body></html>
